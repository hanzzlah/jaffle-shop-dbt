models:
  - name: stg_jaffle_shop__customers
    description: One customer per row
    columns:
      - name: user_id
        description: The unique identifier for each customer
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    description: One order per row
    columns:
      - name: id
        description: The unique identifier for each customer
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: user_id