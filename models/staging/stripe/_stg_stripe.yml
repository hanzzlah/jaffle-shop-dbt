version: 2

sources:
  - name: stripe
    database: raw
    description: Shortcut to the Stripe Schema in the `raw` database in Snowflake
    tables:
      - name: payment
        description: Contains data about the payments made
        config:
            loaded_at_field: _batched_at
            freshness:
              warn_after: {count: 12, period: hour}
              error_after: {count: 24, period: hour}